<!DOCTYPE html><html>
<head>
    <title>CI/CD Deployment</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #222;
        }    .container {
        text-align: center;
        padding: 50px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        animation: fadeIn 1.2s ease-in-out;
    }

    h1 {
        font-size: 44px;
        margin-bottom: 10px;
        color: #1f4037;
    }

    p {
        font-size: 18px;
        color: #444;
        margin-bottom: 25px;
    }

    .status {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 20px;
        background: #1f4037;
        color: white;
        font-size: 14px;
        letter-spacing: 1px;
    }

    .footer {
        margin-top: 25px;
        font-size: 13px;
        color: #666;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

</head>
<body><div class="container">
    <h1>Hello World</h1>
    <p>Your application has been successfully deployed using a CI/CD pipeline.</p><div class="status">
    Deployment Status: Successful
</div>


</div></body>
</html>
